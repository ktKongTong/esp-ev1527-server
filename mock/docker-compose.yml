services:
  mock:
    build: .
    image: omg315-mock:latest
    container_name: omg315-mock
    init: true
    ports:
      - "8099:8099"
    environment:
      # 默认连接宿主机上的本地 EMQX；如果你用下面的 emqx 覆盖文件，
      # MQTT_URL 会被改为 tcp://emqx:1883。
      MQTT_URL: ${MQTT_URL:-tcp://host.docker.internal:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-OpenMQTTGateway_ESP32_315M}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      HTTP_ADDR: ":8099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
