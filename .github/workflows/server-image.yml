name: Server image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/server-image.yml"
      - ".dockerignore"
      - "go-server/**"
  pull_request:
    paths:
      - ".github/workflows/server-image.yml"
      - ".dockerignore"
      - "go-server/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build and publish server image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lowercase repository path.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The versioned tag mirrors the version reported by GET /api/v1/health.
      # Read it from the single source in the contract package so the tag cannot drift.
      - name: Read server version
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*ServerVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' go-server/internal/contract/contract.go)
          if [ -z "$VERSION" ]; then
            echo "ServerVersion not found in go-server/internal/contract/contract.go" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # The GORM sqlite dialector needs CGO, so the arm64 stage runs natively
      # under emulation instead of cross-compiling.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=server-image
          cache-to: type=gha,mode=max,scope=server-image
